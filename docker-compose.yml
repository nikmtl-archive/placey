version: "3.9"

services:
  backend:
    build:
      context: ./placey-be
      dockerfile: Dockerfile
    container_name: csharp-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000

  frontend:
    build: ./placey-fe
    container_name: vue-app
    ports:
      - "8080:80"
    depends_on:
      - backend
