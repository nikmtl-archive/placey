name: Backend CI

on:
  pull_request:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      be: ${{ steps.filter.outputs.be }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            be:
              - 'placey-be/**'
              - 'placey-be.Tests/**'
              - 'placey.sln'
              - '.github/workflows/be-ci.yml'

  build-and-check:
    name: Build, Format Check & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.be == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore tools
        run: dotnet tool restore
        working-directory: placey-be

      - name: Restore dependencies
        run: dotnet restore placey.sln

      - name: Check formatting (CSharpier)
        run: dotnet csharpier check .
        working-directory: placey-be

      - name: Build
        run: dotnet build placey.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test placey.sln --no-build --configuration Release
