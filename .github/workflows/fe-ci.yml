name: Frontend CI

on:
  pull_request:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      fe: ${{ steps.filter.outputs.fe }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fe:
              - 'placey-fe/**'
              - '.github/workflows/fe-ci.yml'

  lint-format-typecheck:
    name: Lint, Format & Type-check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.fe == 'true'

    defaults:
      run:
        working-directory: placey-fe

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: placey-fe/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Prettier)
        run: pnpm ci:format

      - name: Lint (oxlint + ESLint)
        run: pnpm ci:lint

      - name: Type-check (vue-tsc)
        run: pnpm ci:type-check
